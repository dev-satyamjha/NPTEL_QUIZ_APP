<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizzes</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            .main-container {
                max-width: 1200px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 90vh;
            }

            .inner-container {
                width: 100%;
                min-height: 70vh;
                margin: 20px auto 0 auto;
                padding: 40px;
                margin-top: 30px;
                box-sizing: border-box;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            .master-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 80px;
                margin-top: 120px;
            }

            .master-grid .course-btn:nth-child(1):hover {
                background-color: #d48b06;
            }
            .master-grid .course-btn:nth-child(2):hover {
                background-color: #2d80fd;
            }
            .master-grid .course-btn:nth-child(3):hover {
                background-color: #8a2be2;
            }

            .course-btn {
                padding: 25px 20px;
                background: var(--button-background);
                color: var(--text-main);
                border: 1px solid var(--button-border);
                border-radius: 8px;
                cursor: pointer;
                font-size: 1.2em;
                font-weight: bold;
                text-align: center;
                transition: 0.2s;
                box-sizing: border-box;
            }

            .course-btn:hover {
                background: var(--button-hover);
            }

            .course-btn:nth-child(1) {
                grid-column: 1 / -1;
            }

            @media (max-width: 768px) {
                .main-container {
                    padding: 10px;
                }
                .inner-container {
                    padding: 20px;
                    margin-top: 20px;
                }
                .master-grid {
                    grid-template-columns: 1fr;
                    gap: 20px;
                }
                .course-btn:nth-child(1) {
                    grid-column: auto;
                }
                .course-btn {
                    padding: 15px;
                    font-size: 1.1em;
                }
            }
        </style>
    </head>
    <body>
        <div
            style="
                text-align: right;
                max-width: 1400px;
                width: 95%;
                margin: 0 auto;
                padding-bottom: 10px;
            "
        >
            <button id="theme-btn" class="theme-toggle">🌑 Dark Mode</button>
        </div>

        <div class="main-container">
            <h1>NPTEL Course Portal</h1>

            <div class="inner-container">
                <div class="master-grid">
                    <button
                        id="conserv-economics-btn"
                        class="course-btn"
                        onclick="navigateToDashboard('Conservation Economics')"
                    >
                        Conservation Economics
                    </button>
                    <button
                        class="course-btn"
                        onclick="
                            navigateToDashboard('Forests and their Management')
                        "
                    >
                        Forests and their Management
                    </button>
                    <button
                        class="course-btn"
                        onclick="navigateToDashboard('WildLife Ecology')"
                    >
                        WildLifeEcology
                    </button>
                </div>
            </div>
        </div>

        <script>
            const themeToggleBtn = document.getElementById("theme-btn");

            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
                themeToggleBtn.innerText = "☀️ Light Mode";
            }

            themeToggleBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                const isDarkMode =
                    document.body.classList.contains("dark-mode");
                themeToggleBtn.innerText = isDarkMode
                    ? "☀️ Light Mode"
                    : "🌑 Dark Mode";
                localStorage.setItem("theme", isDarkMode ? "dark" : "light");
            });

            function navigateToDashboard(courseName) {
                window.location.href = `dashboard.html?c=${encodeURIComponent(courseName)}`;
            }
        </script>
    </body>
</html>
