<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NPTEL Quiz Dashboard</title>
        <link rel="icon" type="image/png" href="Assets/index_64.png" />
        <link rel="apple-touch-icon" href="Assets/index_180.png" />
        <link rel="stylesheet" href="style.css" />
        <style>
            .main-container {
                max-width: 1200px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 90vh;
            }

            .inner-container {
                width: 100%;
                min-height: 70vh;
                margin: 20px auto 0 auto;
                padding: 40px;
                margin-top: 30px;
                box-sizing: border-box;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            .master-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 80px;
                margin-top: 120px;
            }

            .master-grid .course-btn:nth-child(1):hover {
                background-color: #d48b06;
            }
            .master-grid .course-btn:nth-child(2):hover {
                background-color: #2d80fd;
            }
            .master-grid .course-btn:nth-child(3):hover {
                background-color: #8a2be2;
            }

            .course-btn {
                padding: 25px 20px;
                background: var(--button-background);
                color: var(--text-main);
                border: 1px solid var(--button-border);
                border-radius: 8px;
                cursor: pointer;
                font-size: 1.2em;
                font-weight: bold;
                text-align: center;
                transition: 0.2s;
                box-sizing: border-box;
            }

            .course-btn:hover {
                background: var(--button-hover);
            }

            .course-btn:nth-child(1) {
                grid-column: 1 / -1;
            }

            @media (max-width: 768px) {
                .main-container {
                    padding: 10px;
                }
                .inner-container {
                    padding: 20px;
                    margin-top: 20px;
                }
                .master-grid {
                    grid-template-columns: 1fr;
                    gap: 20px;
                }
                .course-btn:nth-child(1) {
                    grid-column: auto;
                }
                .course-btn {
                    padding: 15px;
                    font-size: 1.1em;
                }
            }
        </style>
    </head>
    <body>
        <div
            style="
                text-align: right;
                max-width: 1400px;
                width: 95%;
                margin: 0 auto;
                padding-bottom: 10px;
            "
        >
            <button id="theme-btn" class="theme-toggle">🌑 Dark Mode</button>
        </div>

        <div class="main-container" style="position: relative">
            <a
                href="https://github.com/dev-satyamjha"
                target="_blank"
                style="
                    position: absolute;
                    top: 30px;
                    right: 30px;
                    color: var(--text-main);
                    text-decoration: none;
                    font-weight: bold;
                    font-size: 1em;
                    transition: 0.2s;
                "
            >
                <svg
                    role="img"
                    viewBox="0 0 24 24"
                    width="32px"
                    height="32px"
                    fill="white"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <title>GitHub</title>
                    <path
                        d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                    />
                </svg>
            </a>

            <h1>PlayGround</h1>

            <div class="inner-container">
                <div class="master-grid">
                    <button
                        id="conserv-economics-btn"
                        class="course-btn"
                        onclick="navigateToDashboard('Conservation Economics')"
                    >
                        Conservation Economics
                    </button>
                    <button
                        class="course-btn"
                        onclick="
                            navigateToDashboard('Forests and their Management')
                        "
                    >
                        Forests and their Management
                    </button>
                    <button
                        class="course-btn"
                        onclick="navigateToDashboard('WildLifeEcology')"
                    >
                        Wildlife Ecology
                    </button>
                </div>
            </div>

            <div
                style="
                    position: absolute;
                    bottom: 20px;
                    left: 0;
                    width: 100%;
                    text-align: center;
                    font-size: 0.9em;
                    color: var(--text-main);
                    opacity: 0.7;
                "
            >
                Made with ❤️ by Satyam Jha
            </div>
        </div>

        <script>
            const themeToggleBtn = document.getElementById("theme-btn");

            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
                themeToggleBtn.innerText = "☀️ Light Mode";
            }

            themeToggleBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                const isDarkMode =
                    document.body.classList.contains("dark-mode");
                themeToggleBtn.innerText = isDarkMode
                    ? "☀️ Light Mode"
                    : "🌑 Dark Mode";
                localStorage.setItem("theme", isDarkMode ? "dark" : "light");
            });

            function navigateToDashboard(courseName) {
                window.location.href = `dashboard.html?c=${encodeURIComponent(courseName)}`;
            }
        </script>
    </body>
</html>
